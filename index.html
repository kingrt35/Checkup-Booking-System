<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Checkup Booking System รพ.จันทรุเบกษา</title>

   <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e3a8a;
        }

        .iframe-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; /* เปลี่ยนจาก calc(100dvh + 45px) เป็น 100% */
            border: none;
            display: block;
        }

        /* =========================
           Mobile
           ========================= */
        @media (max-width: 768px) {

            .iframe-container {
                height: 100dvh;
            }

            iframe {
                /* เว้นระยะรอยบากด้านบน */
                top: env(safe-area-inset-top, 0px);
                left: 0;
                width: 100%;

                /* คำนวณความสูงให้พอดีหน้าจอ หักระยะขอบบนและแถบควบคุมด้านล่าง */
                height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>

<body>

    <div class="iframe-container">

        <iframe
            src="https://script.google.com/macros/s/AKfycbyykQfTMHOPSpHkdZJWZJAI08ERlBmX8acuCOcojcpooKv0IGrcmdSSU6QeakvWDP8_-g/exec"
            allow="clipboard-write">
        </iframe>

    </div>

</body>
</html>
