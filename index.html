<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Checkup Booking System รพ.จันทรุเบกษา</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e3a8a;
        }

        .iframe-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 5 px;
            left: 0;

            width: 100%;

            /* สำคัญ: ไม่ขยาย iframe ด้านล่าง */
            height: calc(100dvh + 45px);

            border: none;
            display: block;
        }

        /* =========================
           Mobile
           ========================= */
        @media (max-width: 768px) {

            .iframe-container {
                height: 100dvh;
                height: 100svh;
            }

            iframe {
                top: 5 px;

                /*
                 * ขยายเฉพาะด้านบน
                 * แต่ให้ด้านล่างจบพอดีกับหน้าจอ
                 */
                height: calc(100svh + 45px);
            }
        }
    </style>
</head>

<body>

    <div class="iframe-container">

        <iframe
            src="https://script.google.com/macros/s/AKfycbyykQfTMHOPSpHkdZJWZJAI08ERlBmX8acuCOcojcpooKv0IGrcmdSSU6QeakvWDP8_-g/exec"
            allow="clipboard-write">
        </iframe>

    </div>

</body>
</html>
